<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndoorLoc Algorithms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* ========================================
           Clean Academic Theme - Navy Blue
           ======================================== */
        :root {
            --primary: #003366;
            --primary-hover: #002244;
            --primary-light: #f0f4f8;
            --primary-border: #d0dce8;

            --bg-body: #ffffff;
            --bg-card: #ffffff;
            --bg-muted: #f8f9fa;
            --text-primary: #111111;
            --text-secondary: #555555;
            --text-muted: #767676;
            --border: #e0e0e0;
            --border-light: #f5f5f5;

            --success: #059669;
            --warning: #d97706;

            /* Category colors */
            --color-supervised-traditional: #3b82f6;
            --color-supervised-deep: #8b5cf6;
            --color-selfsupervised: #06b6d4;
            --color-meta: #f97316;
            --color-transfer: #10b981;
            --color-fusion: #a855f7;
            --color-head: #ec4899;
        }

        [data-theme="dark"] {
            --primary: #64b5f6;
            --primary-hover: #90caf9;
            --primary-light: rgba(100, 181, 246, 0.1);
            --primary-border: #2a4a6a;

            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-muted: #252525;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --text-muted: #888888;
            --border: #333333;
            --border-light: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 14px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .header-left h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .header-left h1 span { color: var(--primary); }

        .header-left p {
            color: var(--text-secondary);
            font-size: 0.9375rem;
        }

        .header-right {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }

        .icon-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .icon-btn svg { width: 18px; height: 18px; }

        /* Stats Section */
        .stats-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: var(--primary-light);
            border: 1px solid var(--primary-border);
            border-radius: 8px;
        }

        .stats-left {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .chart-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chart-container {
            width: 72px;
            height: 72px;
            position: relative;
        }

        .chart-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            text-align: center;
        }

        /* Filter Tabs */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Algorithm List */
        .algorithm-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .algorithm-item {
            background: var(--bg-card);
        }

        .algorithm-header {
            display: grid;
            grid-template-columns: 24px 1fr 120px 140px 60px;
            gap: 12px;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .algorithm-header:hover {
            background: var(--bg-muted);
        }

        .expand-icon {
            color: var(--text-muted);
            transition: transform 0.2s;
        }

        .algorithm-item.expanded .expand-icon {
            transform: rotate(90deg);
        }

        .algorithm-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .algorithm-category {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            text-align: center;
        }

        .category-supervised-traditional {
            background: rgba(59, 130, 246, 0.1);
            color: var(--color-supervised-traditional);
        }

        .category-supervised-deep {
            background: rgba(139, 92, 246, 0.1);
            color: var(--color-supervised-deep);
        }

        .category-selfsupervised {
            background: rgba(6, 182, 212, 0.1);
            color: var(--color-selfsupervised);
        }

        .category-meta {
            background: rgba(249, 115, 22, 0.1);
            color: var(--color-meta);
        }

        .category-transfer {
            background: rgba(16, 185, 129, 0.1);
            color: var(--color-transfer);
        }

        .category-fusion {
            background: rgba(168, 85, 247, 0.1);
            color: var(--color-fusion);
        }

        .category-head {
            background: rgba(236, 72, 153, 0.1);
            color: var(--color-head);
        }

        .algorithm-type {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .algorithm-status {
            font-size: 0.75rem;
            text-align: center;
        }

        .status-implemented {
            color: var(--success);
        }

        .status-planned {
            color: var(--text-muted);
        }

        /* Detail Panel */
        .algorithm-detail {
            display: none;
            padding: 20px;
            background: var(--bg-muted);
            border-top: 1px solid var(--border);
        }

        .algorithm-item.expanded .algorithm-detail {
            display: block;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .detail-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
        }

        .detail-section h4 {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .code-block {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: var(--bg-muted);
            border-bottom: 1px solid var(--border);
            font-size: 0.6875rem;
            color: var(--text-muted);
        }

        .copy-btn {
            padding: 2px 8px;
            font-size: 0.625rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }

        .copy-btn:hover { border-color: var(--primary); color: var(--primary); }
        .copy-btn.copied { background: var(--success); border-color: var(--success); color: white; }

        .code-content {
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            line-height: 1.6;
            overflow-x: auto;
            color: var(--text-primary);
        }

        .params-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .param-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 8px;
            background: var(--bg-muted);
            border-radius: 4px;
        }

        .param-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8125rem;
            color: var(--primary);
        }

        .param-default {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .param-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: right;
        }

        /* Citation Section */
        .citation-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .citation-section h4 {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .citation-text {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .citation-text .title {
            font-style: italic;
        }

        .citation-text .venue {
            font-weight: 500;
        }

        /* Benchmark Section */
        .benchmark-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
        }

        .benchmark-section h4 {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .benchmark-stats {
            display: flex;
            gap: 24px;
        }

        .benchmark-stat {
            text-align: center;
        }

        .benchmark-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
        }

        .benchmark-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Dark mode toggle */
        .theme-toggle .sun-icon { display: none; }
        [data-theme="dark"] .theme-toggle .sun-icon { display: block; }
        [data-theme="dark"] .theme-toggle .moon-icon { display: none; }

        /* Responsive */
        @media (max-width: 768px) {
            .algorithm-header {
                grid-template-columns: 24px 1fr 80px;
            }
            .algorithm-type, .algorithm-status {
                display: none;
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .stats-section {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-left">
                <h1>IndoorLoc <span>Algorithms</span></h1>
                <p>Traditional + Deep Learning localization methods with unified interface</p>
            </div>
            <div class="header-right">
                <a href="https://github.com/qdtiger/indoorloc" class="icon-btn" title="GitHub">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                </a>
                <a href="datasets.html" class="icon-btn" title="Datasets">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7c0-2-1-3-3-3H7C5 4 4 5 4 7z"/><path d="M4 12h16"/><path d="M12 4v16"/></svg>
                </a>
                <button class="icon-btn theme-toggle" onclick="toggleTheme()">
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </div>
        </header>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stats-left">
                <div class="stat-item">
                    <span class="stat-value">30+</span>
                    <span class="stat-label">Supervised-Trad</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">700+</span>
                    <span class="stat-label">Supervised-Deep</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">10+</span>
                    <span class="stat-label">Self-supervised</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">7+</span>
                    <span class="stat-label">Meta-learning</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">20+</span>
                    <span class="stat-label">Transfer</span>
                </div>
            </div>
            <div class="chart-wrapper">
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                    <div class="chart-center">
                        <span id="chartTotal">17</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="supervised-traditional">Supervised-Trad</button>
            <button class="filter-btn" data-filter="supervised-deep">Supervised-Deep</button>
            <button class="filter-btn" data-filter="selfsupervised">Self-supervised</button>
            <button class="filter-btn" data-filter="meta">Meta-learning</button>
            <button class="filter-btn" data-filter="transfer">Transfer</button>
            <button class="filter-btn" data-filter="fusion">Fusion</button>
            <button class="filter-btn" data-filter="head">Heads</button>
        </div>

        <!-- Algorithm List -->
        <div class="algorithm-list" id="algorithmList"></div>
    </div>

    <script>
        // Algorithm data
        const algorithms = [
            // ==================== Supervised Learning - Traditional ML ====================
            {
                name: "k-NN",
                fullName: "k-Nearest Neighbors",
                category: "supervised-traditional",
                type: "Instance-based",
                description: "经典K近邻算法，基于信号相似度查找最近参考点进行位置估计",
                implemented: true,
                params: [
                    { name: "k", default: "5", desc: "近邻数量 (1-20)" },
                    { name: "weights", default: "'distance'", desc: "权重: uniform | distance" },
                    { name: "metric", default: "'euclidean'", desc: "距离: euclidean | manhattan | cosine | minkowski" },
                    { name: "algorithm", default: "'auto'", desc: "算法: auto | ball_tree | kd_tree | brute" },
                    { name: "leaf_size", default: "30", desc: "BallTree/KDTree 叶子大小" },
                    { name: "p", default: "2", desc: "Minkowski 距离参数 (1=曼哈顿, 2=欧氏)" },
                    { name: "n_jobs", default: "None", desc: "并行数 (-1=全部CPU)" },
                    { name: "predict_floor", default: "true", desc: "是否预测楼层" },
                    { name: "predict_building", default: "true", desc: "是否预测建筑" }
                ],
                quickStart: `import indoorloc as iloc

model = iloc.create_model('knn', k=5)
model.fit(train)
result = model.predict(test)`,
                citation: {
                    authors: "Bahl, P., & Padmanabhan, V. N.",
                    title: "RADAR: An in-building RF-based user location and tracking system",
                    venue: "IEEE INFOCOM 2000",
                    year: 2000,
                    doi: "10.1109/INFCOM.2000.832252"
                },
                benchmark: { dataset: "UJIndoorLoc", meanError: "7.9m", floorAcc: "90.2%" }
            },
            {
                name: "WKNN",
                fullName: "Weighted k-Nearest Neighbors",
                category: "supervised-traditional",
                type: "Instance-based",
                description: "加权K近邻，距离越近的参考点权重越大，提高定位精度",
                implemented: true,
                params: [
                    { name: "k", default: "5", desc: "近邻数量 (1-20)" },
                    { name: "weights", default: "'distance'", desc: "权重: distance" }
                ],
                quickStart: `import indoorloc as iloc

model = iloc.create_model('wknn', k=5)
model.fit(train)
result = model.predict(test)`,
                citation: {
                    authors: "Torres-Sospedra, J., et al.",
                    title: "UJIndoorLoc: A new multi-building and multi-floor database",
                    venue: "IPIN 2014",
                    year: 2014,
                    doi: "10.1109/IPIN.2014.7275492"
                },
                benchmark: { dataset: "UJIndoorLoc", meanError: "7.3m", floorAcc: "92.5%" }
            },
            {
                name: "SVM",
                fullName: "Support Vector Machine",
                category: "supervised-traditional",
                type: "Kernel-based",
                description: "支持向量机，通过核函数将数据映射到高维空间进行分类/回归",
                implemented: true,
                params: [
                    { name: "kernel", default: "'rbf'", desc: "核函数: rbf | linear | poly | sigmoid" },
                    { name: "C", default: "1.0", desc: "正则化参数" },
                    { name: "gamma", default: "'scale'", desc: "核系数: scale | auto | float" },
                    { name: "predict_floor", default: "true", desc: "是否预测楼层" },
                    { name: "predict_building", default: "true", desc: "是否预测建筑" }
                ],
                quickStart: `import indoorloc as iloc

model = iloc.SVMLocalizer(kernel='rbf', C=1.0)
model.fit(train)
result = model.predict(test)`,
                citation: {
                    authors: "Vapnik, V. N.",
                    title: "The Nature of Statistical Learning Theory",
                    venue: "Springer",
                    year: 1995,
                    doi: "10.1007/978-1-4757-2440-0"
                },
                benchmark: { dataset: "UJIndoorLoc", meanError: "9.5m", floorAcc: "88.0%" }
            },
            {
                name: "Random Forest",
                fullName: "Random Forest",
                category: "supervised-traditional",
                type: "Ensemble",
                description: "随机森林，集成多棵决策树进行预测，抗过拟合能力强",
                implemented: true,
                params: [
                    { name: "n_estimators", default: "100", desc: "树的数量" },
                    { name: "max_depth", default: "None", desc: "最大深度" },
                    { name: "min_samples_split", default: "2", desc: "内部节点分裂最小样本数" },
                    { name: "n_jobs", default: "-1", desc: "并行数 (-1=全部CPU)" },
                    { name: "predict_floor", default: "true", desc: "是否预测楼层" },
                    { name: "predict_building", default: "true", desc: "是否预测建筑" }
                ],
                quickStart: `import indoorloc as iloc

model = iloc.RandomForestLocalizer(n_estimators=100)
model.fit(train)
result = model.predict(test)`,
                citation: {
                    authors: "Breiman, L.",
                    title: "Random Forests",
                    venue: "Machine Learning, 45(1)",
                    year: 2001,
                    doi: "10.1023/A:1010933404324"
                },
                benchmark: { dataset: "UJIndoorLoc", meanError: "10.8m", floorAcc: "89.0%" }
            },

            // ==================== Supervised Learning - Deep Learning ====================
            {
                name: "MLP",
                fullName: "Multi-Layer Perceptron",
                category: "supervised-deep",
                type: "MLP Backbone",
                description: "多层感知机，全连接网络，适合表格型RSSI数据，训练快速",
                implemented: true,
                params: [
                    { name: "hidden_dims", default: "[512, 256, 128]", desc: "隐藏层维度列表" },
                    { name: "dropout", default: "0.3", desc: "Dropout比例" },
                    { name: "activation", default: "'relu'", desc: "激活函数: relu | gelu | silu" },
                    { name: "batch_norm", default: "True", desc: "是否使用BatchNorm" }
                ],
                quickStart: `import indoorloc as iloc

model = iloc.DeepLocalizer(
    backbone={'type': 'MLPBackbone', 'hidden_dims': [512, 256]},
    head={'type': 'HybridHead', 'num_floors': 5}
)
model.fit(train, epochs=50)`,
                citation: null,
                benchmark: { dataset: "UJIndoorLoc", meanError: "8-12m", floorAcc: "~90%" }
            },
            {
                name: "CNN1D",
                fullName: "1D Convolutional Network",
                category: "supervised-deep",

        // Render algorithm list
        function renderAlgorithms(filter = 'all') {
            const list = document.getElementById('algorithmList');
            const filtered = filter === 'all'
                ? algorithms
                : algorithms.filter(a => a.category === filter);

            list.innerHTML = filtered.map((algo, idx) => `
                <div class="algorithm-item" data-idx="${idx}">
                    <div class="algorithm-header" onclick="toggleAlgorithm(this)">
                        <svg class="expand-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                        <span class="algorithm-name">${algo.name}</span>
                        <span class="algorithm-category category-${algo.category}">${algo.category}</span>
                        <span class="algorithm-type">${algo.type}</span>
                        <span class="algorithm-status ${algo.implemented ? 'status-implemented' : 'status-planned'}">
                            ${algo.implemented ? '✓ Ready' : '○ Planned'}
                        </span>
                    </div>
                    <div class="algorithm-detail">
                        <p style="margin-bottom: 16px; color: var(--text-secondary);">${algo.description}</p>

                        <div class="detail-grid">
                            <div class="detail-section">
                                <h4>Quick Start</h4>
                                <div class="code-block">
                                    <div class="code-header">
                                        <span>Python</span>
                                        <button class="copy-btn" onclick="copyCode(event, '${algo.name}')">Copy</button>
                                    </div>
                                    <pre class="code-content">${algo.quickStart}</pre>
                                </div>
                            </div>
                            <div class="detail-section">
                                <h4>Parameters</h4>
                                <div class="params-list">
                                    ${algo.params.map(p => `
                                        <div class="param-item">
                                            <div>
                                                <span class="param-name">${p.name}</span>
                                                <span class="param-default">= ${p.default}</span>
                                            </div>
                                            <span class="param-desc">${p.desc}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        ${algo.citation ? `
                        <div class="citation-section">
                            <h4>📄 Citation</h4>
                            <p class="citation-text">
                                ${algo.citation.authors} (${algo.citation.year}).
                                <span class="title">${algo.citation.title}</span>.
                                <span class="venue">${algo.citation.venue}</span>.
                            </p>
                        </div>
                        ` : ''}

                        ${algo.benchmark ? `
                        <div class="benchmark-section">
                            <h4>📊 Reference Performance (${algo.benchmark.dataset})</h4>
                            <div class="benchmark-stats">
                                <div class="benchmark-stat">
                                    <div class="benchmark-value">${algo.benchmark.meanError}</div>
                                    <div class="benchmark-label">Mean Error</div>
                                </div>
                                <div class="benchmark-stat">
                                    <div class="benchmark-value">${algo.benchmark.floorAcc}</div>
                                    <div class="benchmark-label">Floor Accuracy</div>
                                </div>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Toggle algorithm detail
        function toggleAlgorithm(header) {
            const item = header.closest('.algorithm-item');
            item.classList.toggle('expanded');
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderAlgorithms(btn.dataset.filter);
            });
        });

        // Theme toggle
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            localStorage.setItem('theme', html.getAttribute('data-theme'));
            updateChart();
        }

        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Donut chart
        let chart = null;
        function updateChart() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

            const traditionalCount = algorithms.filter(a => a.category === 'supervised-traditional').length;
            const deepCount = algorithms.filter(a => a.category === 'supervised-deep').length;
            const selfsupervisedCount = algorithms.filter(a => a.category === 'selfsupervised').length;
            const metaCount = algorithms.filter(a => a.category === 'meta').length;
            const transferCount = algorithms.filter(a => a.category === 'transfer').length;
            const fusionCount = algorithms.filter(a => a.category === 'fusion').length;
            const headCount = algorithms.filter(a => a.category === 'head').length;

            if (chart) chart.destroy();

            chart = new Chart(document.getElementById('categoryChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Supervised-Trad', 'Supervised-Deep', 'Self-supervised', 'Meta-learning', 'Transfer', 'Fusion', 'Heads'],
                    datasets: [{
                        data: [traditionalCount, deepCount, selfsupervisedCount, metaCount, transferCount, fusionCount, headCount],
                        backgroundColor: ['#3b82f6', '#8b5cf6', '#06b6d4', '#f97316', '#10b981', '#a855f7', '#ec4899'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '65%',
                    plugins: { legend: { display: false } },
                    responsive: true,
                    maintainAspectRatio: true
                }
            });
        }

        // Copy code function
        function copyCode(e, name) {
            e.stopPropagation();
            const algo = algorithms.find(a => a.name === name);
            if (algo) {
                navigator.clipboard.writeText(algo.quickStart);
                const btn = e.target;
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('copied');
                }, 1500);
            }
        }

        // Initialize
        renderAlgorithms();
        updateChart();
    </script>
