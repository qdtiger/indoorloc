<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dataset Distribution</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .header {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header h1 {
            font-size: 18px;
            color: #2c3e50;
            font-weight: 600;
        }
        .toggle-group {
            display: flex;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
        }
        .toggle-btn {
            padding: 8px 20px;
            border: none;
            background: white;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .toggle-btn:hover { background: #f0f0f0; }
        .toggle-btn.active {
            background: #2171b5;
            color: white;
        }
        .toggle-btn:first-child { border-right: 1px solid #ccc; }
        .floor-select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
            background: white;
            cursor: pointer;
            min-width: 150px;
        }
        .floor-select:focus { outline: none; border-color: #2171b5; }
        .frame-container {
            width: 100%;
            height: calc(100vh - 60px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dataset Distribution</h1>
        <div class="toggle-group">
            <button class="toggle-btn active" onclick="switchView('2d')">2D View</button>
            <button class="toggle-btn" onclick="switchView('3d')">3D View</button>
        </div>
        <select class="floor-select" id="floor-select" onchange="onFloorChange()">
            <option value="0">B0 Floor 0</option>
            <option value="1">B0 Floor 1</option>
            <option value="2">B0 Floor 2</option>
            <option value="3">B0 Floor 3</option>
            <option value="4">B1 Floor 0</option>
            <option value="5">B1 Floor 1</option>
            <option value="6">B1 Floor 2</option>
            <option value="7">B1 Floor 3</option>
            <option value="8">B2 Floor 0</option>
            <option value="9">B2 Floor 1</option>
            <option value="10">B2 Floor 2</option>
            <option value="11">B2 Floor 3</option>
            <option value="12">B2 Floor 4</option>
        </select>
    </div>
    <div class="frame-container">
        <iframe id="viz-frame" src="distribution_2d.html"></iframe>
    </div>
    <script>
        let currentView = '2d';
        let currentFloor = 0;

        function switchView(mode) {
            currentView = mode;
            const btns = document.querySelectorAll('.toggle-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (mode === '2d') {
                btns[0].classList.add('active');
            } else {
                btns[1].classList.add('active');
            }
            updateFrame();
        }

        function onFloorChange() {
            currentFloor = document.getElementById('floor-select').value;
            updateFrame();
        }

        function updateFrame() {
            const frame = document.getElementById('viz-frame');
            const baseSrc = currentView === '2d' ? 'distribution_2d.html' : 'distribution_3d.html';
            frame.src = baseSrc + '?floor=' + currentFloor;
        }
    </script>
</body>
</html>
