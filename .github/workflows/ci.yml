name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read  # the jobs only read the repository

# checkout@v7 and setup-python@v7 run on Node 24; GitHub removed Node 20 from its runners on 2026-09-23.
jobs:
  core:
    # numpy is the only runtime dependency: every layer must import and pass its tests with it alone.
    # The py3.10 job also pins the oldest numpy that pyproject.toml accepts.
    name: core (numpy only, py${{ matrix.python-version }}${{ matrix.numpy && format(', numpy{0}', matrix.numpy) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - python-version: '3.10'
            numpy: '==2.0.*'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest "numpy${{ matrix.numpy }}"
    - name: Import every layer without optional packages
      run: |
        python - <<'EOF'
        import importlib, sys
        import indoorloc
        assert "numpy" not in sys.modules, "import indoorloc must not load numpy"
        for layer in ("core", "datasets", "signals", "methods", "evaluation", "apps"):
            importlib.import_module(f"indoorloc.{layer}")
        heavy = sorted(m for m in ("torch", "sklearn", "scipy", "pandas", "matplotlib", "h5py") if m in sys.modules)
        assert not heavy, heavy
        import numpy
        print("layers import on numpy", numpy.__version__, "alone")
        EOF
    - name: Command-line entry points
      run: |
        python -m indoorloc --version
        indoorloc list datasets
    - name: Tests (optional-dependency tests skip)
      run: python -m pytest -q

  full:
    name: full (all extras, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      # torchvision (pulled in by timm) must come from the same CPU index as torch: the PyPI build
      # is linked against CUDA torch and fails on import ("operator torchvision::nms does not exist").
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[full,transfer,dev]"
    - name: Tests (real-data tests skip, as CI downloads no dataset)
      run: python -m pytest -q
    - name: Documentation snippets run
      run: python docs/catalog.py --snippets --no-data

  contracts:
    name: layer contracts, lint and packaging
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e . "import-linter>=2.1" "ruff>=0.6" pytest
    - name: Import contracts (layers, data-enters-as-tables, light-layers)
      run: lint-imports
    - name: Documentation catalogs match the registries
      run: python docs/catalog.py --check && python -m doctest docs/catalog.py
    - name: Architecture figure claims only shipped modules
      run: python -m pytest -q tests/test_architecture_figure.py
    - name: Ruff (rule selection in pyproject.toml)
      run: ruff check
    - name: The wheel ships every module and the literature tables, and nothing else
      run: |
        pip wheel --no-deps . -w dist
        python - <<'EOF'
        import glob, pathlib, zipfile
        names = set(zipfile.ZipFile(glob.glob("dist/indoorloc-*.whl")[0]).namelist())
        source = {p.as_posix() for p in pathlib.Path("indoorloc").rglob("*")
                  if p.is_file() and "__pycache__" not in p.parts}
        assert not source - names, sorted(source - names)
        extra = [n for n in names if not n.startswith(("indoorloc/", "indoorloc-"))]
        assert not extra, extra
        print(len(names), "files in", glob.glob("dist/*.whl")[0])
        EOF
